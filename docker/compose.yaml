name: mealie-mcp

services:
  mealie-mcp:
    image: ${MEALIE_MCP_IMAGE:-ghcr.io/brunofelixns/mealie-mcp-server:latest}
    pull_policy: missing
    restart: unless-stopped
    command: [--transport, http, --host, 0.0.0.0, --port, "8000"]
    env_file: .env
    environment:
      MCP_REQUIRE_HTTPS: ${MCP_REQUIRE_HTTPS:-true}
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PUBLISHED_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
