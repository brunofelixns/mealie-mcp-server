name: mealie-mcp

x-runtime: &runtime
  image: ${MEALIE_MCP_IMAGE:?Configura MEALIE_MCP_IMAGE en .env}
  pull_policy: missing
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
  pids_limit: 256

x-mealie-environment: &mealie-environment
  MEALIE_BASE_URL: ${MEALIE_BASE_URL:?Configura MEALIE_BASE_URL en .env}
  MEALIE_API_KEY: ${MEALIE_API_KEY:?Configura MEALIE_API_KEY en .env}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MEALIE_MCP_DEBUG: ${MEALIE_MCP_DEBUG:-false}

services:
  mealie-mcp:
    <<: *runtime
    restart: unless-stopped
    command: [--transport, http, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *mealie-environment
      # The application validates this only for HTTP; stdio needs no HTTP token.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.example.com/mcp}
      MCP_REQUIRE_HTTPS: ${MCP_REQUIRE_HTTPS:-true}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  stdio:
    <<: *runtime
    profiles: [stdio]
    stdin_open: true
    tty: false
    command: [--transport, stdio]
    environment:
      <<: *mealie-environment
