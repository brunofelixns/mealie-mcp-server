name: Test and publish runtime
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag to verify and publish to GHCR
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') && github.ref != 'refs/heads/main' }}
jobs:
  quality:
    name: Workflow and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Copy the PR event without interpreting its contents
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts
          cp "$GITHUB_EVENT_PATH" artifacts/pull-request-event.json
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
      - name: Validate workflows and release titles in the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GH_ADVISORY_TOKEN: ${{ github.token }}
        with:
          push: never
          env: |
            GH_ADVISORY_TOKEN
          runCmd: |
            set -eu
            if test -f artifacts/pull-request-event.json; then
              uv run --frozen python scripts/check_pr_title.py --event artifacts/pull-request-event.json
              uv run --frozen python scripts/review_python_dependencies.py --event artifacts/pull-request-event.json --output artifacts/python-dependency-review.json
            fi
            uv run --frozen python scripts/check_workflows.py
      - name: Retain Python dependency review evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-review
          path: artifacts/python-dependency-review.json
          if-no-files-found: warn
          retention-days: 14
  checks:
    name: Verify ${{ matrix.arch }}
    needs: quality
    if: always()
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require successful workflow and dependency policy
        env:
          POLICY_RESULT: ${{ needs.quality.result }}
        run: test "$POLICY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify inside the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            set -eu
            mkdir -p artifacts
            rm -f artifacts/coverage.json artifacts/coverage.xml artifacts/pytest.xml artifacts/runtime-security.summary.json artifacts/verification-summary.md
            trap 'uv run --frozen python scripts/ci_summary.py --artifacts artifacts' EXIT
            uv sync --frozen --group dev
            uv lock --check --offline
            uv run ruff check .
            uv run ruff format --check .
            uv run mypy src/mealie_mcp_server
            mkdir -p artifacts
            docker buildx build --platform linux/${{ matrix.arch }} --target runtime --tag mealie-mcp-server:local --build-arg VCS_REF=$(git rev-parse HEAD) --provenance=false --load --metadata-file artifacts/runtime-build.json .
            export MCP_TEST_ARCH=${{ matrix.arch }}
            uv run pytest --cov=mealie_mcp_server --cov-branch --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/pytest.xml
            uv run python scripts/check_compatibility.py --require-all --coverage-json artifacts/coverage.json --junit-xml artifacts/pytest.xml
            uv run python scripts/generate_docs.py --check
            uv run python -m tests.e2e.runner --image mealie-mcp-server:local --no-build > artifacts/mealie-integration.log 2>&1
            uv run python scripts/scan_runtime.py mealie-mcp-server:local --platform linux/${{ matrix.arch }} --output artifacts/runtime-security.json --enforce
            uv build
            uv run python -c 'import json,pathlib,subprocess,tomllib; print(json.dumps({"version":tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"],"revision":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}))' > artifacts/runtime-${{ matrix.arch }}.json
            docker image inspect --format '{{.Id}}' mealie-mcp-server:local > artifacts/runtime-${{ matrix.arch }}.id
            docker image save --output artifacts/runtime-${{ matrix.arch }}.tar mealie-mcp-server:local
      - name: Retain the exact tested image
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-runtime-${{ matrix.arch }}
          path: |
            artifacts/runtime-${{ matrix.arch }}.tar
            artifacts/runtime-${{ matrix.arch }}.id
            artifacts/runtime-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-${{ matrix.arch }}
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.xml
            artifacts/verification-summary.md
            artifacts/e2e/**
            dist/*.whl
          retention-days: 14
      - name: Show verification results
        if: always()
        run: |
          if test -f artifacts/verification-summary.md; then
            cat artifacts/verification-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    name: Publish tested images to GHCR
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.stage.outputs.digest }}
      image: ${{ steps.stage.outputs.image }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download both tested runtimes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: tested-runtime-*
          path: artifacts/images
          merge-multiple: true
      - name: Download the matching scan evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: runtime-evidence-*
          path: artifacts/evidence
      - name: Read the tested version
        id: version
        run: |
          version=$(jq -r .version artifacts/images/runtime-amd64.json)
          test "$version" = "$(jq -r .version artifacts/images/runtime-arm64.json)"
          for arch in amd64 arm64; do
            test "$(jq -r .revision "artifacts/images/runtime-$arch.json")" = "$GITHUB_SHA"
          done
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage and verify the tested multi-platform image
        id: stage
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_tag="sha-$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tag=$(git ls-remote origin "refs/tags/v$RELEASE_VERSION" | cut -f1)
          test "$remote_tag" = "$GITHUB_SHA"
          for arch in amd64 arm64; do
            docker image load --input "artifacts/images/runtime-$arch.tar"
            expected_id=$(cat "artifacts/images/runtime-$arch.id")
            actual_id=$(docker image inspect --format '{{.Id}}' mealie-mcp-server:local)
            test "$actual_id" = "$expected_id"
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mealie-mcp-server:local)
            test "$platform" = "linux/$arch"
            docker tag mealie-mcp-server:local "$image:$commit_tag-$arch"
          done
          for arch in amd64 arm64; do
            docker push "$image:$commit_tag-$arch"
          done
          amd64=$(docker buildx imagetools inspect "$image:$commit_tag-amd64" --format '{{.Manifest.Digest}}')
          arm64=$(docker buildx imagetools inspect "$image:$commit_tag-arm64" --format '{{.Manifest.Digest}}')
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$image:$commit_tag" "$image@$amd64" "$image@$arm64"
          actual=$(docker buildx imagetools inspect "$image:$commit_tag" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{println}}{{end}}' | sort)
          expected=$(printf 'linux/amd64 %s\nlinux/arm64 %s\n' "$amd64" "$arm64" | sort)
          test "$actual" = "$expected"
          digest=$(docker buildx imagetools inspect "$image:$commit_tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\ndigest=%s\namd64=%s\narm64=%s\n' "$image" "$digest" "$amd64" "$arm64" >> "$GITHUB_OUTPUT"
      - name: Attest the tested index provenance
        id: provenance-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest amd64 provenance
        id: provenance-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest arm64 provenance
        id: provenance-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the tested amd64 SBOM
        id: sbom-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.amd64 }}
          sbom-path: artifacts/evidence/runtime-evidence-amd64/artifacts/runtime-security.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the tested arm64 SBOM
        id: sbom-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.arm64 }}
          sbom-path: artifacts/evidence/runtime-evidence-arm64/artifacts/runtime-security.sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Collect signed verification bundles
        env:
          PROVENANCE_INDEX: ${{ steps.provenance-index.outputs.bundle-path }}
          PROVENANCE_AMD64: ${{ steps.provenance-amd64.outputs.bundle-path }}
          PROVENANCE_ARM64: ${{ steps.provenance-arm64.outputs.bundle-path }}
          SBOM_AMD64: ${{ steps.sbom-amd64.outputs.bundle-path }}
          SBOM_ARM64: ${{ steps.sbom-arm64.outputs.bundle-path }}
        run: |
          mkdir -p artifacts/attestations
          cp "$PROVENANCE_INDEX" artifacts/attestations/provenance-index.json
          cp "$PROVENANCE_AMD64" artifacts/attestations/provenance-amd64.json
          cp "$PROVENANCE_ARM64" artifacts/attestations/provenance-arm64.json
          cp "$SBOM_AMD64" artifacts/attestations/sbom-amd64.json
          cp "$SBOM_ARM64" artifacts/attestations/sbom-arm64.json
      - name: Verify signed subjects and promote the tested release
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          STAGED_DIGEST: ${{ steps.stage.outputs.digest }}
          STAGED_AMD64_DIGEST: ${{ steps.stage.outputs.amd64 }}
          STAGED_ARM64_DIGEST: ${{ steps.stage.outputs.arm64 }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_tag="sha-$GITHUB_SHA"
          digest="$STAGED_DIGEST"
          for subject in index amd64 arm64; do
            case "$subject" in
              index) subject_digest="$digest" ;;
              amd64) subject_digest="$STAGED_AMD64_DIGEST" ;;
              arm64) subject_digest="$STAGED_ARM64_DIGEST" ;;
            esac
            gh attestation verify "oci://$image@$subject_digest" --bundle "artifacts/attestations/provenance-$subject.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            if test "$subject" != index; then
              gh attestation verify "oci://$image@$subject_digest" --bundle "artifacts/attestations/sbom-$subject.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --predicate-type https://cyclonedx.org/bom
            fi
          done
          if existing=$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{.Manifest.Digest}}' 2> artifacts/version-tag-inspect.log); then
            test "$existing" = "$digest"
          else
            grep -Fq "$image:$RELEASE_VERSION: not found" artifacts/version-tag-inspect.log || grep -Eq 'manifest unknown(:|$)' artifacts/version-tag-inspect.log
          fi
          docker buildx imagetools create --tag "$image:$RELEASE_VERSION" "$image@$digest"
          test "$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')" = "$digest"
          highest=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=main" --jq .content | base64 --decode | jq -r '."."')
          [[ "$highest" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          latest=false
          if test "$highest" = "$RELEASE_VERSION"; then
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
            test "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')" = "$digest"
            latest=true
          fi
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          printf '### Published version %s\n\nImage: %s:%s\n\nCommit: %s:%s\n\nDigest: %s\n' "$RELEASE_VERSION" "$image" "$RELEASE_VERSION" "$image" "$commit_tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the signed release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-evidence
          path: |
            artifacts/attestations/
            artifacts/evidence/
            artifacts/images/*.json
            artifacts/images/*.id
          if-no-files-found: error
          retention-days: 90
  release-evidence:
    name: Preserve evidence with the GitHub Release
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
      RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release-evidence
          path: evidence
      - name: Archive reports, SBOMs and signed bundles with checksums
        run: |
          set -euo pipefail
          printf 'image=%s\ndigest=%s\nrevision=%s\nrun=%s/actions/runs/%s\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > evidence/release.txt
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > evidence-SHA256SUMS
          mv evidence-SHA256SUMS evidence/SHA256SUMS
          archive="release-evidence-$RELEASE_TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" -C evidence .
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY"
