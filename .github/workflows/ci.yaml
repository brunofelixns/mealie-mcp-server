name: Test and publish runtime
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release_status:
    name: Identify merged release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.release.outputs.number }}
    steps:
      - name: Identify a release PR merged by this push
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -r --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .head.ref == "codex/release-main" and .head.repo.full_name == $repo) | .number')
          test "$(printf '%s' "$number" | wc -l)" -eq 0
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
  checks:
    name: Verify ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify inside the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            set -eu
            uv sync --frozen --group dev
            uv run ruff check .
            uv run ruff format --check .
            uv run mypy src/mealie_mcp_server
            mkdir -p artifacts
            docker buildx build --platform linux/${{ matrix.arch }} --target runtime --tag mealie-mcp-server:local --build-arg VCS_REF=$(git rev-parse HEAD) --provenance=false --load --metadata-file artifacts/runtime-build.json .
            export MCP_TEST_ARCH=${{ matrix.arch }}
            uv run pytest --cov=mealie_mcp_server --cov-branch --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/pytest.xml
            uv run python scripts/check_compatibility.py --require-all --coverage-json artifacts/coverage.json --junit-xml artifacts/pytest.xml
            uv run python scripts/generate_docs.py --check
            uv run python -m tests.e2e.runner --image mealie-mcp-server:local --no-build > artifacts/mealie-integration.log 2>&1
            uv run python scripts/scan_runtime.py mealie-mcp-server:local --platform linux/${{ matrix.arch }} --output artifacts/runtime-security.json --enforce
            uv build
            uv run python -c 'import json,pathlib,subprocess,tomllib; print(json.dumps({"version":tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"],"revision":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}))' > artifacts/runtime-${{ matrix.arch }}.json
            docker image inspect --format '{{.Id}}' mealie-mcp-server:local > artifacts/runtime-${{ matrix.arch }}.id
            docker image save --output artifacts/runtime-${{ matrix.arch }}.tar mealie-mcp-server:local
      - name: Retain the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-runtime-${{ matrix.arch }}
          path: |
            artifacts/runtime-${{ matrix.arch }}.tar
            artifacts/runtime-${{ matrix.arch }}.id
            artifacts/runtime-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-${{ matrix.arch }}
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.xml
            artifacts/e2e/**
            dist/*.whl
          retention-days: 14
  release_pr:
    name: Update release PR
    needs: [release_status, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_status.outputs.number == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-pr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare version inside the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: uv run --frozen python scripts/ci_version.py prepare --output artifacts/version
      - name: Create or update the accumulated release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/release-main
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if test "$current" != "$GITHUB_SHA"; then
            echo 'A newer main push will update the release PR.'
            exit 0
          fi
          previous=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          version=$(jq -r .version artifacts/version/release.json)
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json number --jq '.[0].number // empty')
          if test -n "$number"; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "chore(release): $version" --body-file artifacts/version/notes.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "chore(release): $version" --body-file artifacts/version/notes.md
          fi
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$branch"
      - name: Retain release proposal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-proposal
          path: artifacts/version/
          retention-days: 14
  publish:
    name: Publish tested images to GHCR
    needs: [release_status, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_status.outputs.number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download both tested runtimes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: tested-runtime-*
          path: artifacts/images
          merge-multiple: true
      - name: Read the tested version
        id: version
        run: |
          version=$(jq -r .version artifacts/images/runtime-amd64.json)
          test "$version" = "$(jq -r .version artifacts/images/runtime-arm64.json)"
          for arch in amd64 arm64; do
            test "$(jq -r .revision "artifacts/images/runtime-$arch.json")" = "$GITHUB_SHA"
          done
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the tested multi-platform image
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_tag="sha-$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tag=$(git ls-remote origin "refs/tags/v$RELEASE_VERSION" | cut -f1)
          test -z "$remote_tag" || test "$remote_tag" = "$GITHUB_SHA"
          for arch in amd64 arm64; do
            docker image load --input "artifacts/images/runtime-$arch.tar"
            expected_id=$(cat "artifacts/images/runtime-$arch.id")
            actual_id=$(docker image inspect --format '{{.Id}}' mealie-mcp-server:local)
            test "$actual_id" = "$expected_id"
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mealie-mcp-server:local)
            test "$platform" = "linux/$arch"
            docker tag mealie-mcp-server:local "$image:$commit_tag-$arch"
          done
          for arch in amd64 arm64; do
            docker push "$image:$commit_tag-$arch"
          done
          amd64=$(docker buildx imagetools inspect "$image:$commit_tag-amd64" --format '{{.Manifest.Digest}}')
          arm64=$(docker buildx imagetools inspect "$image:$commit_tag-arm64" --format '{{.Manifest.Digest}}')
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$image:$commit_tag" "$image@$amd64" "$image@$arm64"
          actual=$(docker buildx imagetools inspect "$image:$commit_tag" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{println}}{{end}}' | sort)
          expected=$(printf 'linux/amd64 %s\nlinux/arm64 %s\n' "$amd64" "$arm64" | sort)
          test "$actual" = "$expected"
          digest=$(docker buildx imagetools inspect "$image:$commit_tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if existing=$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{.Manifest.Digest}}' 2> artifacts/version-tag-inspect.log); then
            test "$existing" = "$digest"
          else
            grep -Fq "$image:$RELEASE_VERSION: not found" artifacts/version-tag-inspect.log || grep -Eq 'manifest unknown(:|$)' artifacts/version-tag-inspect.log
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            test "$(git rev-parse "refs/tags/v$RELEASE_VERSION")" = "$GITHUB_SHA"
          else
            git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/v$RELEASE_VERSION"
          docker buildx imagetools create --tag "$image:$RELEASE_VERSION" "$image@$digest"
          test "$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')" = "$digest"
          highest=$(git ls-remote --tags origin 'refs/tags/v*' | cut -f2 | sed -nE 's#^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -1)
          latest=false
          if test "$highest" = "$RELEASE_VERSION"; then
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
            test "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')" = "$digest"
            latest=true
          fi
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          printf '### Published version %s\n\n`%s:%s`\n\n`%s:%s`\n\nDigest: `%s`\n' "$RELEASE_VERSION" "$image" "$RELEASE_VERSION" "$image" "$commit_tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NUMBER: ${{ needs.release_status.outputs.number }}
          IS_LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          gh pr view "$RELEASE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > artifacts/release-notes.md
          if ! gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$RELEASE_VERSION" --notes-file artifacts/release-notes.md --latest="$IS_LATEST"
          fi
