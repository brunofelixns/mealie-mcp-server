name: Python and runtime checks
on:
  push:
    branches: [migration/python]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify inside the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            uv sync --frozen --group dev
            uv run ruff check .
            uv run ruff format --check .
            uv run mypy src/mealie_mcp_server
            docker build -f tests/reference/Dockerfile -t mealie-mcp-reference:upstream-d027e1b .
            mkdir -p artifacts
            docker buildx build --platform linux/${{ matrix.arch }} --target runtime --tag mealie-mcp-server:local --build-arg VCS_REF=$(git rev-parse HEAD) --sbom=true --provenance=mode=max --load --metadata-file artifacts/runtime-build.json .
            export MCP_TEST_ARCH=${{ matrix.arch }}
            uv run pytest
            uv run python scripts/scan_runtime.py mealie-mcp-server:local --platform linux/${{ matrix.arch }} --output artifacts/runtime-security.json --enforce
            uv build
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-${{ matrix.arch }}
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            dist/*.whl
          retention-days: 14
